<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Set up your expert profile · DZ-Bridge</title><style>@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=DM+Mono:wght@400;500&amp;family=El+Messiri:wght@600;700&amp;family=Cairo:wght@400;500;600&amp;display=swap");</style><defs><filter id="f1" filterUnits="userSpaceOnUse" x="104" y="190.09" width="890" height="420"><feGaussianBlur stdDeviation="24"/></filter></defs><rect width="1440" height="1000" fill="#faf8f3"/><rect x="0" y="0" width="1440" height="1000" fill="#faf8f3"/><text x="140" y="146" font-family="Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="34" font-weight="600" letter-spacing="-0.51" fill="#13201a" textLength="396.03" lengthAdjust="spacingAndGlyphs">Set up your expert profile</text><text x="140" y="174.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5d6b64" textLength="428.25" lengthAdjust="spacingAndGlyphs">About 8 minutes, or 3 with a CV. Progress saves automatically.</text><rect x="1050.8" y="157.59" width="7" height="7" rx="3.5" fill="#2e7d4f"/><text x="1064.8" y="165.09" font-family="'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" letter-spacing="0.48" fill="#9aa39e" textLength="99.84" lengthAdjust="spacingAndGlyphs">Not saved yet</text><rect x="1179.14" y="142.59" width="120.36" height="37" rx="18.5" fill="none" stroke="#9aa39e" stroke-width="1"/><text x="1195.64" y="166.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#13201a" textLength="87.36" lengthAdjust="spacingAndGlyphs">Save and exit</text><rect x="176" y="262.09" width="746" height="276" fill="#28011f" fill-opacity="0.35" filter="url(#f1)"/><rect x="140" y="202.09" width="818" height="348" rx="22" fill="#ffffff"/><rect x="140.5" y="202.59" width="817" height="347" rx="21.5" fill="none" stroke="#e6e0d3" stroke-width="1"/><rect x="519" y="259.09" width="60" height="60" rx="30" fill="#3a0233"/><svg width="26" height="26" viewBox="0 0 24 24" fill="#000000" stroke="none" x="536" y="276.09"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="419.64" y="365.09" font-family="Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="30" font-weight="600" fill="#13201a" textLength="258.7" lengthAdjust="spacingAndGlyphs">Your profile is live</text><text x="343.44" y="397.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5d6b64" textLength="411.13" lengthAdjust="spacingAndGlyphs">We will notify you when an organization’s needs match your</text><text x="363.45" y="419.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5d6b64" textLength="371.09" lengthAdjust="spacingAndGlyphs">expertise. Your identity stays hidden until you accept.</text><rect x="378.3" y="449.09" width="186.97" height="44" rx="22" fill="#3a0233"/><text x="399.3" y="476.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#ffffff" textLength="144.97" lengthAdjust="spacingAndGlyphs">Go to my dashboard</text><rect x="575.77" y="449.59" width="143.42" height="43" rx="21.5" fill="none" stroke="#9aa39e" stroke-width="1"/><text x="596.27" y="476.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#13201a" textLength="102.42" lengthAdjust="spacingAndGlyphs">Edit my profile</text><rect x="980" y="202.09" width="320" height="249" rx="18" fill="#ffffff"/><rect x="980.5" y="202.59" width="319" height="248" rx="17.5" fill="none" stroke="#e6e0d3" stroke-width="1"/><text x="999" y="232.09" font-family="'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="0.88" fill="#9aa39e" textLength="187" lengthAdjust="spacingAndGlyphs">HOW ORGANIZATIONS SEE YOU</text><rect x="999.5" y="247.59" width="281" height="136" rx="13.5" fill="none" stroke="#e6e0d3" stroke-width="1"/><rect x="1014" y="263.59" width="42" height="42" rx="12" fill="#eeddee"/><text x="1027.19" y="289.09" font-family="'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#3a0233" textLength="15.61" lengthAdjust="spacingAndGlyphs">B7</text><text x="1068" y="277.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#13201a" textLength="92.16" lengthAdjust="spacingAndGlyphs">Expert #B731</text><text x="1068" y="299.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6b64" textLength="87.41" lengthAdjust="spacingAndGlyphs">Diaspora · Lyon</text><text x="1014" y="331.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="italic" fill="#9aa39e" textLength="148.92" lengthAdjust="spacingAndGlyphs">Your fields will appear here</text><rect x="1014" y="348.09" width="252" height="7" rx="3.5" fill="#f2efe9"/><rect x="1014" y="362.09" width="156.23" height="7" rx="3.5" fill="#f2efe9"/><svg width="16" height="16" viewBox="0 0 20 20" fill="#000000" stroke="none" x="999" y="397.09"><g fill="none" stroke="#9a7424" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="9" width="12" height="8.5" rx="2" fill="none" stroke="#9a7424"/><path d="M6.8 9V6.5a3.2 3.2 0 0 1 6.4 0V9" fill="none" stroke="#9a7424"/></g></svg><text x="1025" y="409.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6b64" textLength="244.88" lengthAdjust="spacingAndGlyphs">Your name, photo and contact details stay</text><text x="1025" y="427.09" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6b64" textLength="214.06" lengthAdjust="spacingAndGlyphs">hidden until you accept an invitation.</text><rect x="0" y="0" width="1440" height="71" fill="#faf8f3" fill-opacity="0.9"/><line x1="0" y1="70.5" x2="1440" y2="70.5" stroke="#e6e0d3" stroke-width="1"/><rect x="140" y="18" width="34" height="34" rx="8" fill="#3a0233"/><text x="145.67" y="41" font-family="Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="16" font-weight="600" letter-spacing="-0.2" fill="#ffffff" textLength="22.66" lengthAdjust="spacingAndGlyphs">DZ</text><text x="184" y="42" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.2" fill="#13201a" textLength="96.61" lengthAdjust="spacingAndGlyphs">DZ-Bridge</text><rect x="1191.16" y="26.5" width="24" height="17" rx="3" fill="#13201a" fill-opacity="0.12"/><svg viewBox="0 0 60 30" fill="#000000" stroke="none" x="1192.16" y="27.5" width="22" height="15"><clipPath id="s2"><path d="M0 0h60v30H0z" fill="#000000" stroke="none"/></clipPath><clipPath id="s3"><path d="M30 15h30v15zv15H0zH0V0zV0h30z" fill="#000000" stroke="none"/></clipPath><g clip-path="url(#s2)" fill="#000000" stroke="none"><path d="M0 0v30h60